

services:

  db:
    image: postgres:17
    volumes:
      - pgdata_2:/var/lib/postgresql/data
    environment:
      TZ: Europe/Moscow
      POSTGRES_PASSWORD: profit
      POSTGRES_USER: profit
      POSTGRES_DB: profit
    ports:
      - "5431:5432"

  php-fpm:
    build:
      context: docker/php-fpm
    volumes:
      - ./:/app
    depends_on:
      - db
    environment:
      PHP_IDE_CONFIG: "serverName=Docker"

  nginx:
    build:
      context: docker/nginx-php
    ports:
      - "8080:80"
    volumes:
      - ./:/app
    depends_on:
      - php-fpm


volumes:
  pgdata_2:
